[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "punishment-sim"
version = "0.1.0"
description = "Noisy-oracle petty-punishment selfish-mining simulator"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
punishment-sim = "punishment_sim.cli:main"

[tool.setuptools.packages.find]
include = ["punishment_sim*"]

[tool.pytest.ini_options]
markers = ["statistical: slower Monte Carlo validation"]
testpaths = ["tests"]
